name: Task delta check

# Lightweight: no tests and no dependencies. It runs on every PR so it can be marked as a
# required check without getting stuck as "expected" on docs-only PRs; the script itself
# does nothing when no code changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  task-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a valid context delta when code changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m scripts.check_task_delta --base "origin/$BASE_REF"
