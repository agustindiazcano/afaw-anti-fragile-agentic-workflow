name: Checks

# Deterministic checks on the state and knowledge files of a pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  state-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip && pip install --group dev

      - name: Task files (lifecycle, declared values only, no deletions)
        run: >-
          python -m scripts.check_task_files
          --base "$(git merge-base origin/${{ github.base_ref }} HEAD)"
          --head-branch "${{ github.head_ref }}"
          --target "origin/${{ github.base_ref }}"

      - name: Context delta (files_touched equals the changed code files)
        run: python -m scripts.check_task_delta --base "origin/${{ github.base_ref }}"

      - name: Red-first (every added test fails on the old code)
        run: python -m scripts.red_check --base "origin/${{ github.base_ref }}"

      - name: Show changes to human-only files in the summary
        run: |
          for f in state/equivalent_mutants.json; do
            if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "$f"; then
              {
                echo "### \`$f\` changed in this pull request"
                echo "Only the human may write this file. Review every line."
                echo '```diff'
                git diff "origin/${{ github.base_ref }}...HEAD" -- "$f"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: ADRs, gotchas and links
        run: python -m scripts.check_docs

      - name: Derived views build from this commit
        run: python -m scripts.build_state --ref HEAD --out build/state
