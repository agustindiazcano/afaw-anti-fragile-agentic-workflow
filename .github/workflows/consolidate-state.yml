name: Consolidate state

# After a task is merged, regenerate the consolidated files from the per-task files and open
# a PR for a human to approve. This workflow never pushes to main and never merges.
#
# Requires the repository setting: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
# PRs opened with GITHUB_TOKEN do not trigger other workflows; that is fine here because the
# PR only contains generated JSON (no code, so no tests).
on:
  push:
    branches: [main]
    paths:
      - "state/tasks/**"
      - "context/tasks/**"
      - "state/schemas/**"
  workflow_dispatch:

concurrency:
  group: consolidate-state
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: chore/consolidate-state

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate state/pending.json and the global and per-role contexts
        run: python -m scripts.merge_state
      - name: Open or update the consolidation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add state/pending.json context/global context/roles
          git commit -m "chore(state): consolidate task state and contexts"
          # Bot-owned branch, rebuilt from main on every run, so a plain force push is safe.
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(state): consolidate task state and contexts" \
              --body "Automated. Regenerates state/pending.json and the global and per-role lastcontext.json from state/tasks and context/tasks. Generated files only. Needs a human approval; do not merge without one."
          fi
