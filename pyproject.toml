# Tooling config for the state scripts (scripts/ and tests/tooling/) only.
# It says nothing about the project's own stack. In a real project, merge these sections
# into the project's pyproject.toml, or delete them if the project does not use Python.

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "characterization(reason): documents behavior the code already has; the red-first check skips it",
]
